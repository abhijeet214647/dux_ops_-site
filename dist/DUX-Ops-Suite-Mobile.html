<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#FFFFFF">
<title>DUX Ops</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;450;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<!--
  DUX Ops Suite — /m mobile app (the page the APK loads, prototype).
  First launch asks which apps you work in; the chosen apps become the bottom tabs.
  Same 8 apps, screens, fields and rules as the desktop page. Demo data, held in memory.
-->
<style>

/* ============================ DUX tokens (scoped) ============================ */
.dx-root{
  --iris:#5C4DE6;--iris-soft:#6D5EF6;--iris-deep:#4A3CD0;--iris-tint:rgba(92,77,230,.10);
  --cyan:#0E9C8B;--cyan-soft:#0CB4A0;--cyan-tint:rgba(14,156,139,.12);
  --brand-grad:linear-gradient(90deg,var(--iris) 0%,#4F9FD8 55%,var(--cyan) 100%);
  --canvas:#F3F4F7;--surface-1:#FFFFFF;--surface-2:#FFFFFF;--surface-3:#F0F1F5;--card-bg:#FFFFFF;
  --pill-bg:#F5F6F9;--th-bg:#FAFAFC;--meta-bg:#FAFAFC;--hdr-bg:rgba(255,255,255,.82);
  --hairline:#E7E9EE;--hairline-2:#DCDFE6;
  --fg-1:#1A2030;--fg-2:#586273;--fg-3:#8A93A3;--fg-4:#AAB2BF;
  --ok:#15916A;--ok-bg:rgba(21,145,106,.10);--pending:#B0741A;--pending-bg:rgba(176,116,26,.11);
  --err:#C8475E;--err-bg:rgba(200,71,94,.09);
  --row-hover:rgba(92,77,230,.045);--avatar-bg:#F4F4FC;--scrollthumb:#D4D8E0;
  --ambient:radial-gradient(120% 64% at 50% -16%,rgba(92,77,230,.06),transparent 60%),radial-gradient(80% 50% at 88% 6%,rgba(14,156,139,.045),transparent 55%);
  --text-on-brand:#FFFFFF;
  --font-ui:'Geist','Geist Variable',system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-mono:'JetBrains Mono',ui-monospace,'SF Mono',Menlo,monospace;
  --fs-display:26px;--fs-h1:22px;--fs-h2:18px;--fs-h3:16px;--fs-body:14.5px;--fs-sm:13px;--fs-meta:12.5px;--fs-label:11px;--fs-micro:10.5px;
  --ls-display:-.025em;--ls-tight:-.02em;--ls-label:.08em;
  --sp-1:4px;--sp-2:8px;--sp-3:12px;--sp-4:16px;--sp-5:20px;--sp-6:24px;--sp-8:32px;
  --r-sm:8px;--r-md:12px;--r-lg:16px;--r-xl:22px;--r-pill:999px;
  --shadow-card:0 6px 26px rgba(22,28,46,.07);--shadow-pop:0 10px 34px rgba(22,28,46,.10);
  --inset-hi:inset 0 1px 0 rgba(255,255,255,.6);--shadow-brand:0 6px 18px rgba(109,94,246,.40);
  --spring:cubic-bezier(.22,1,.36,1);--ease:cubic-bezier(.4,0,.2,1);--dur-fast:.18s;--dur-base:.25s;--dur-slow:.45s;
  --mark-light:block;--mark-white:none;
  --sb-w:248px;
}
.dx-root[data-theme="dark"]{
  --iris:#6D5EF6;--iris-soft:#8A7DF8;--iris-deep:#5B4DE0;--iris-tint:rgba(109,94,246,.14);
  --cyan:#2DD4BF;--cyan-soft:#5CE6D5;--cyan-tint:rgba(45,212,191,.14);
  --canvas:#0A0D13;--surface-1:#11151E;--surface-2:#181D29;--surface-3:#1E2433;--card-bg:linear-gradient(180deg,#181D29,#161A25);
  --pill-bg:#1E2433;--th-bg:#141926;--meta-bg:rgba(255,255,255,.008);--hdr-bg:rgba(17,21,30,.80);
  --hairline:#232938;--hairline-2:#2C3344;
  --fg-1:#E8EAF1;--fg-2:#9AA3B7;--fg-3:#5E6678;--fg-4:#424A5C;
  --ok:#34D39A;--ok-bg:rgba(52,211,154,.10);--pending:#E0A85C;--pending-bg:rgba(224,168,92,.11);
  --err:#E8738A;--err-bg:rgba(232,115,138,.10);
  --row-hover:rgba(109,94,246,.06);--avatar-bg:rgba(255,255,255,.035);--scrollthumb:#2C3344;
  --ambient:radial-gradient(120% 70% at 50% -12%,rgba(109,94,246,.16),transparent 60%),radial-gradient(90% 60% at 88% 8%,rgba(45,212,191,.07),transparent 55%);
  --shadow-card:0 18px 50px rgba(0,0,0,.42);--shadow-pop:0 14px 40px rgba(0,0,0,.40);--inset-hi:inset 0 1px 0 rgba(255,255,255,.045);
  --mark-light:none;--mark-white:block;
}

/* ================================ base ================================ */
html,body{margin:0;background:#F3F4F7}
body.dx-dark{background:#0A0D13}
.dx-root{min-height:100vh;display:grid;grid-template-columns:var(--sb-w) minmax(0,1fr);background-color:var(--canvas);background-image:var(--ambient);background-attachment:fixed;color:var(--fg-1);font-family:var(--font-ui);font-size:var(--fs-body);line-height:1.6;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
.dx-root *,.dx-root *::before,.dx-root *::after{box-sizing:border-box}
.dx-root button,.dx-root input,.dx-root select{font:inherit;color:inherit}
.dx-root button{cursor:pointer}
.dx-root a{color:var(--iris);text-decoration:none}
.dx-root ::selection{background:var(--iris-tint)}
.dx-root :focus-visible{outline:2px solid var(--iris);outline-offset:2px}
.dx-root ::-webkit-scrollbar{width:10px;height:10px}
.dx-root ::-webkit-scrollbar-thumb{background:var(--scrollthumb);border-radius:10px;border:3px solid transparent;background-clip:content-box}
.dx-mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.dx-num{font-family:var(--font-mono);font-variant-numeric:tabular-nums;color:var(--cyan)}
.dx-muted{color:var(--fg-3)}
.dx-faint{color:var(--fg-4)}
.dx-eyebrow{font-size:var(--fs-label);letter-spacing:var(--ls-label);text-transform:uppercase;font-weight:600;color:var(--fg-3)}
.dx-grad{background:var(--brand-grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.dx-ico{display:block;flex:0 0 auto}
.dx-sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ================================ sidebar ================================ */
.dx-side{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:2px;padding:18px 14px 16px;background:var(--surface-1);border-right:1px solid var(--hairline)}
.dx-brand{display:flex;align-items:center;gap:11px;padding:2px 6px 18px}
.dx-mark{position:relative;display:grid;place-items:center;width:38px;height:38px;border-radius:11px;background:var(--avatar-bg);border:1px solid var(--hairline-2);box-shadow:var(--inset-hi);flex:0 0 auto;overflow:hidden}
.dx-mark img{width:62%;height:auto}
.dx-mark .m-light{display:var(--mark-light)}
.dx-mark .m-white{display:var(--mark-white)}
.dx-mark::after{content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;background:var(--brand-grad);opacity:.45;pointer-events:none;-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude}
.dx-brand-name{font-weight:600;font-size:15px;letter-spacing:var(--ls-tight);line-height:1.2}
.dx-brand-sub{font-family:var(--font-mono);font-size:11px;color:var(--fg-3);line-height:1.3}
.dx-nav-label{padding:14px 12px 6px}
.dx-nav{display:flex;align-items:center;gap:11px;width:100%;height:40px;padding:0 12px;border-radius:10px;border:1px solid transparent;background:none;color:var(--fg-2);font-size:13.5px;font-weight:500;text-align:left;transition:transform var(--dur-base) var(--spring),color var(--dur-fast) var(--ease),background var(--dur-fast) var(--ease)}
.dx-nav:hover{color:var(--iris);background:var(--row-hover);transform:translateX(3px)}
.dx-nav[aria-current="page"]{color:var(--iris);background:var(--iris-tint);border-color:rgba(92,77,230,.16)}
.dx-navcount{margin-left:auto;font-family:var(--font-mono);font-size:11px;color:var(--cyan);font-variant-numeric:tabular-nums}
.dx-side-foot{margin-top:auto;display:flex;flex-direction:column;gap:10px;padding-top:14px;border-top:1px solid var(--hairline)}
.dx-user{display:flex;align-items:center;gap:10px;padding:4px 6px}
.dx-avatar{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;background:var(--iris-tint);color:var(--iris);font-weight:600;font-size:12.5px;flex:0 0 auto}
.dx-user-name{font-size:13px;font-weight:500;line-height:1.25}
.dx-user-role{font-size:11.5px;color:var(--fg-3);line-height:1.25}

/* ================================ header ================================ */
.dx-main{min-width:0;display:flex;flex-direction:column}
.dx-top{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:12px;min-height:64px;padding:12px 28px;background:var(--hdr-bg);-webkit-backdrop-filter:blur(14px) saturate(1.6);backdrop-filter:blur(14px) saturate(1.6);border-bottom:1px solid var(--hairline)}
.dx-top-mark{display:none}
.dx-top-title{min-width:0;flex:1 1 auto}
.dx-crumbs{display:flex;align-items:center;gap:6px;font-size:var(--fs-label);letter-spacing:var(--ls-label);text-transform:uppercase;font-weight:600;color:var(--fg-3);line-height:1.3}
.dx-crumbs button{background:none;border:0;padding:0;color:inherit;letter-spacing:inherit;text-transform:inherit;font-weight:inherit;font-size:inherit}
.dx-crumbs button:hover{color:var(--iris)}
.dx-title{margin:0;font-size:var(--fs-h2);font-weight:600;letter-spacing:var(--ls-tight);line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dx-top-actions{display:flex;align-items:center;gap:8px;flex:0 0 auto}
.dx-view{width:100%;max-width:1280px;margin:0 auto;padding:24px 28px 56px}
.dx-view.dx-enter{animation:dxSettle var(--dur-slow) var(--spring)}
@keyframes dxSettle{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* ================================ controls ================================ */
.dx-btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:38px;padding:0 16px;border-radius:var(--r-pill);border:1px solid transparent;font-size:13px;font-weight:500;line-height:1;white-space:nowrap;transition:transform var(--dur-base) var(--spring),border-color var(--dur-fast) var(--ease),color var(--dur-fast) var(--ease),background var(--dur-fast) var(--ease),box-shadow var(--dur-fast) var(--ease)}
.dx-btn:hover:not(:disabled){transform:translateY(-1px)}
.dx-btn:active:not(:disabled){transform:translateY(0) scale(.985)}
.dx-btn:disabled{opacity:.45;cursor:not-allowed}
.dx-btn-primary{color:var(--text-on-brand);background:linear-gradient(150deg,var(--iris),var(--iris-deep));box-shadow:var(--shadow-brand),inset 0 1px 0 rgba(255,255,255,.22)}
.dx-btn-secondary{color:var(--fg-1);background:var(--surface-1);border-color:var(--hairline-2);box-shadow:var(--inset-hi)}
.dx-btn-secondary:hover:not(:disabled){border-color:var(--iris);color:var(--iris)}
.dx-root a.dx-btn-secondary{color:var(--fg-1)}.dx-root a.dx-btn-secondary:hover{color:var(--iris);text-decoration:none}
.dx-btn-ghost{color:var(--fg-2);background:transparent}
.dx-btn-ghost:hover:not(:disabled){color:var(--iris)}
.dx-btn-danger{color:var(--err);background:var(--err-bg)}
.dx-btn-sm{height:30px;padding:0 12px;font-size:12px;gap:6px}
.dx-btn-lg{height:46px;padding:0 20px;font-size:14px}
.dx-ibtn{display:grid;place-items:center;width:34px;height:34px;border-radius:10px;border:1px solid var(--hairline-2);background:var(--surface-1);color:var(--fg-2);flex:0 0 auto;transition:transform var(--dur-base) var(--spring),color var(--dur-fast) var(--ease),border-color var(--dur-fast) var(--ease)}
.dx-ibtn:hover:not(:disabled){transform:translateY(-1px);color:var(--iris);border-color:var(--iris)}
.dx-ibtn:disabled{opacity:.4;cursor:not-allowed}
.dx-ibtn-ghost{border-color:transparent;background:transparent}
.dx-badge{display:inline-flex;align-items:center;gap:5px;padding:4px 9px;border-radius:var(--r-pill);font-size:var(--fs-micro);font-weight:600;line-height:1;background:var(--surface-3);color:var(--fg-2);white-space:nowrap}
.dx-badge-iris{color:var(--iris);background:var(--iris-tint)}
.dx-badge-cyan{color:var(--cyan);background:var(--cyan-tint);font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.dx-status{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:var(--r-pill);font-size:var(--fs-micro);font-weight:500;line-height:1.3;white-space:nowrap;color:var(--fg-2);background:var(--surface-3)}
.dx-status::before{content:"";width:5px;height:5px;border-radius:50%;background:currentColor}
.dx-status-ok{color:var(--ok);background:var(--ok-bg)}
.dx-status-pending{color:var(--pending);background:var(--pending-bg)}

/* ================================ cards ================================ */
.dx-card{position:relative;background:var(--card-bg);border:1px solid var(--hairline);border-radius:var(--r-lg);box-shadow:var(--shadow-card),var(--inset-hi);overflow:hidden;min-width:0}
.dx-card-accent::before{content:"";position:absolute;left:0;right:0;top:0;height:2px;background:var(--brand-grad);opacity:.6;z-index:1}
.dx-card-visible{overflow:visible}
.dx-card-head{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--hairline)}
.dx-card-head h3{margin:0;font-size:14.5px;font-weight:600;letter-spacing:-.01em;flex:1 1 auto;min-width:0}
.dx-card-head .dx-sub{font-size:12px;color:var(--fg-3);font-weight:400}
.dx-card-body{padding:16px}
.dx-tile{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;flex:0 0 auto;color:var(--iris);background:var(--iris-tint)}
.dx-tile-cyan{color:var(--cyan);background:var(--cyan-tint)}
.dx-tile-ok{color:var(--ok);background:var(--ok-bg)}
.dx-tile-pending{color:var(--pending);background:var(--pending-bg)}
.dx-meta{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:10px 16px;border-bottom:1px solid var(--hairline);background:var(--meta-bg);font-size:var(--fs-meta);color:var(--fg-2)}

/* hero + kpis */
.dx-hero{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;flex-wrap:wrap;margin:4px 0 22px}
.dx-hero h1{margin:6px 0 6px;font-size:var(--fs-display);font-weight:600;letter-spacing:var(--ls-display);line-height:1.2}
.dx-hero p{margin:0;max-width:560px;color:var(--fg-2)}
.dx-hero-actions{display:flex;gap:8px;flex-wrap:wrap}
.dx-kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:18px}
.dx-kpi{padding:16px 18px 15px}
.dx-kpi-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.dx-kpi-val{margin-top:10px;font-family:var(--font-mono);font-variant-numeric:tabular-nums;font-size:26px;font-weight:600;letter-spacing:-.02em;line-height:1.1;color:var(--cyan)}
.dx-kpi-val small{font-size:13px;font-weight:500;margin-left:3px;color:var(--fg-3)}
.dx-kpi-sub{margin-top:6px;font-size:12px;color:var(--fg-3)}
.dx-cols{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(0,1fr);gap:16px;margin-bottom:16px}

/* zone progress */
.dx-zrow{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) 64px 70px;align-items:center;gap:14px;padding:10px 16px;border-bottom:1px solid var(--hairline);font-size:var(--fs-sm)}
.dx-zrow:last-child{border-bottom:0}
.dx-zrow-head{padding-top:9px;padding-bottom:9px;background:var(--th-bg)}
.dx-zname{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dx-zname span{display:block;font-size:11.5px;font-weight:400;color:var(--fg-3)}
.dx-bar{height:6px;border-radius:99px;background:var(--surface-3);overflow:hidden}
.dx-bar>i{display:block;height:100%;border-radius:inherit;background:var(--cyan);opacity:.85;transition:width var(--dur-slow) var(--spring)}
.dx-right{text-align:right}

/* list rows (recent) */
.dx-lrow{display:flex;align-items:center;gap:12px;width:100%;padding:11px 16px;border:0;border-bottom:1px solid var(--hairline);background:none;text-align:left;transition:transform var(--dur-base) var(--spring),background var(--dur-fast) var(--ease)}
.dx-lrow:last-child{border-bottom:0}
.dx-lrow:hover{background:var(--row-hover)}
.dx-lrow:hover .dx-lrow-main{transform:translateX(3px)}
.dx-lrow-main{flex:1 1 auto;min-width:0;transition:transform var(--dur-base) var(--spring)}
.dx-lrow-title{font-weight:500;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dx-lrow-sub{font-size:12px;color:var(--fg-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dx-lrow-end{display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex:0 0 auto}

/* materials summary grid */
.dx-mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:1px;background:var(--hairline)}
.dx-mcell{padding:13px 16px;background:var(--surface-1)}
.dx-root[data-theme="dark"] .dx-mcell{background:#171B27}
.dx-mcell-label{font-size:12px;color:var(--fg-3)}
.dx-mcell-val{font-family:var(--font-mono);font-variant-numeric:tabular-nums;font-size:18px;font-weight:600;color:var(--cyan);line-height:1.4}
.dx-mcell-val small{font-size:11.5px;color:var(--fg-3);font-weight:500;margin-left:3px}

/* ================================ filters / table ================================ */
.dx-toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.dx-search{display:flex;align-items:center;gap:9px;flex:1 1 280px;min-width:0;height:42px;padding:0 13px;border-radius:var(--r-md);background:var(--surface-1);border:1px solid var(--hairline-2);box-shadow:var(--inset-hi);color:var(--fg-3);transition:border-color var(--dur-base) var(--ease),box-shadow var(--dur-base) var(--ease)}
.dx-search:focus-within{border-color:var(--iris);box-shadow:0 0 0 3px var(--iris-tint);color:var(--iris)}
.dx-search input{flex:1 1 auto;min-width:0;height:100%;border:0;outline:0;background:transparent;font-size:14px;color:var(--fg-1)}
.dx-search input::placeholder{color:var(--fg-4)}
.dx-seg{display:inline-flex;flex-wrap:wrap;gap:6px}
.dx-seg button{height:34px;padding:0 13px;border-radius:var(--r-pill);border:1px solid var(--hairline-2);background:var(--surface-1);color:var(--fg-2);font-size:12.5px;font-weight:500;transition:all var(--dur-fast) var(--ease)}
.dx-seg button:hover{color:var(--iris);border-color:var(--iris)}
.dx-seg button[aria-pressed="true"]{color:var(--iris);background:var(--iris-tint);border-color:rgba(92,77,230,.35)}
.dx-seg button .dx-mono{margin-left:6px;font-size:11px;color:var(--cyan)}
.dx-filters{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:14px}
.dx-filterbar{position:relative;padding:13px 16px 12px}
.dx-filterbar::before{content:"";position:absolute;left:0;right:0;top:0;height:2px;background:var(--brand-grad);opacity:.6}
.dx-filterbar-label{display:flex;align-items:center;gap:7px;margin-bottom:10px}
.dx-pills{display:flex;flex-wrap:wrap;gap:8px}
.dx-pill{display:inline-flex;align-items:center;gap:7px;padding:5px 8px 5px 7px;border-radius:var(--r-sm);font-size:12.5px;background:var(--pill-bg);border:1px solid var(--hairline-2);color:var(--fg-1);line-height:1.3}
.dx-pill .dx-tile{width:22px;height:22px;border-radius:6px}
.dx-pill-k{color:var(--fg-3)}
.dx-pill-v{font-weight:500}
.dx-pill-x{display:grid;place-items:center;width:20px;height:20px;border-radius:6px;border:0;background:none;color:var(--fg-3);padding:0}
.dx-pill-x:hover{color:var(--err);background:var(--err-bg)}
.dx-tablewrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
.dx-table{width:100%;border-collapse:separate;border-spacing:0;font-size:var(--fs-sm)}
.dx-table th{position:sticky;top:0;z-index:1;background:var(--th-bg);text-align:left;font-size:var(--fs-label);letter-spacing:var(--ls-label);text-transform:uppercase;font-weight:600;color:var(--fg-3);padding:10px 14px;border-bottom:1px solid var(--hairline);white-space:nowrap}
.dx-table td{padding:11px 14px;border-bottom:1px solid var(--hairline);white-space:nowrap;vertical-align:middle}
.dx-table tbody tr:last-child td{border-bottom:0}
.dx-table tbody tr.dx-click{cursor:pointer;transition:background var(--dur-fast) var(--ease)}
.dx-table tbody tr.dx-click:hover{background:var(--row-hover)}
.dx-table .num{text-align:right;font-family:var(--font-mono);font-variant-numeric:tabular-nums;color:var(--cyan)}
.dx-table th.num{text-align:right;color:var(--fg-3);font-family:var(--font-ui)}
.dx-table .zero{color:var(--fg-4)}
.dx-table .strong{font-weight:500;color:var(--fg-1)}
.dx-table tfoot td{background:var(--th-bg);font-weight:600;border-top:1px solid var(--hairline);border-bottom:0}
.dx-cards{display:none}
.dx-ecard{display:block;width:100%;padding:13px 16px;border:0;border-bottom:1px solid var(--hairline);background:none;text-align:left}
.dx-ecard:last-child{border-bottom:0}
.dx-ecard:active{background:var(--row-hover)}
.dx-ecard-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.dx-ecard-name{font-weight:500;font-size:14px;line-height:1.35}
.dx-ecard-sub{font-size:12px;color:var(--fg-3);margin-top:2px}
.dx-ecard-foot{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:8px;font-size:12px;color:var(--fg-3)}
.dx-pager{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 16px;border-top:1px solid var(--hairline);font-size:var(--fs-meta);color:var(--fg-3)}
.dx-pager-btns{display:flex;gap:6px}
.dx-empty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;padding:44px 20px;color:var(--fg-2)}
.dx-empty .dx-tile{width:44px;height:44px;border-radius:13px;margin-bottom:6px}
.dx-empty b{color:var(--fg-1);font-weight:600;font-size:15px}
.dx-empty p{margin:0;max-width:360px;font-size:13px;color:var(--fg-3)}
.dx-thumbcell{display:inline-grid;place-items:center;width:38px;height:38px;border-radius:8px;border:1px solid var(--hairline-2);overflow:hidden;background:var(--surface-3);color:var(--fg-3);padding:0}
.dx-thumbcell img{width:100%;height:100%;object-fit:cover}

/* ================================ form ================================ */
.dx-steps{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 4px;margin:0 -2px 16px;scrollbar-width:none}
.dx-steps::-webkit-scrollbar{display:none}
.dx-stepchip{display:inline-flex;align-items:center;gap:8px;height:34px;padding:0 13px 0 5px;border-radius:var(--r-pill);border:1px solid var(--hairline-2);background:var(--surface-1);font-size:12.5px;font-weight:500;color:var(--fg-2);white-space:nowrap;transition:all var(--dur-fast) var(--ease)}
.dx-stepchip:hover{border-color:var(--iris);color:var(--iris)}
.dx-stepchip i{display:grid;place-items:center;width:24px;height:24px;border-radius:50%;font-style:normal;font-family:var(--font-mono);font-size:11px;background:var(--surface-3);color:var(--fg-3)}
.dx-stepchip.done i{background:var(--ok-bg);color:var(--ok)}
.dx-stepchip.bad i{background:var(--err-bg);color:var(--err)}
.dx-stepchip .dx-mono{font-size:11px;color:var(--cyan)}
.dx-form{display:flex;flex-direction:column;gap:16px}
.dx-section{scroll-margin-top:84px}
.dx-section .dx-card-head .dx-tile{width:28px;height:28px}
.dx-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px 16px}
.dx-grid-2{grid-template-columns:repeat(2,minmax(0,1fr))}
.dx-span-2{grid-column:span 2}
.dx-span-all{grid-column:1/-1}
.dx-field{display:flex;flex-direction:column;gap:6px;min-width:0;position:relative}
.dx-label{display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:500;color:var(--fg-2);line-height:1.3}
.dx-req{color:var(--err);font-weight:600}
.dx-input{width:100%;height:42px;padding:0 13px;border-radius:var(--r-md);border:1px solid var(--hairline-2);background:var(--surface-1);box-shadow:var(--inset-hi);font-size:14.5px;color:var(--fg-1);outline:0;transition:border-color var(--dur-base) var(--ease),box-shadow var(--dur-base) var(--ease)}
.dx-input::placeholder{color:var(--fg-4)}
.dx-input:focus{border-color:var(--iris);box-shadow:0 0 0 3px var(--iris-tint)}
.dx-input:disabled{opacity:.55;cursor:not-allowed}
.dx-input.dx-mono{letter-spacing:.04em}
.dx-input[type="date"]{font-family:var(--font-mono);font-size:13.5px}
.dx-root[data-theme="dark"] .dx-input[type="date"]{color-scheme:dark}
.dx-inwrap{position:relative}
.dx-inwrap .dx-input{padding-right:62px}
.dx-count{position:absolute;right:12px;top:50%;transform:translateY(-50%);display:flex;align-items:center;gap:4px;font-family:var(--font-mono);font-size:11.5px;color:var(--fg-3);pointer-events:none}
.dx-field.ok .dx-count{color:var(--ok)}
.dx-msg{font-size:12px;line-height:1.4;color:var(--fg-3)}
.dx-msg:empty{display:none}
.dx-field.err .dx-input,.dx-field.err .dx-combo{border-color:var(--err);box-shadow:0 0 0 3px var(--err-bg)}
.dx-field.err .dx-msg{color:var(--err)}
.dx-field.err .dx-count{color:var(--err)}
.dx-combo{display:flex;align-items:center;gap:8px;width:100%;height:42px;padding:0 12px 0 13px;border-radius:var(--r-md);border:1px solid var(--hairline-2);background:var(--surface-1);box-shadow:var(--inset-hi);text-align:left;font-size:14.5px;color:var(--fg-1);transition:border-color var(--dur-base) var(--ease),box-shadow var(--dur-base) var(--ease)}
.dx-combo:hover:not(:disabled){border-color:var(--iris)}
.dx-combo[aria-expanded="true"]{border-color:var(--iris);box-shadow:0 0 0 3px var(--iris-tint)}
.dx-combo:disabled{opacity:.55;cursor:not-allowed}
.dx-combo-val{flex:1 1 auto;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dx-combo-val.ph{color:var(--fg-4)}
.dx-combo-val small{color:var(--fg-3);font-family:var(--font-mono);font-size:11.5px;margin-left:6px}
.dx-combo .dx-ico{color:var(--fg-3)}
.dx-hint{display:flex;align-items:center;gap:8px;padding:9px 12px;border-radius:10px;background:var(--surface-3);font-size:12.5px;color:var(--fg-2);line-height:1.45}
.dx-hint b{font-weight:500;color:var(--fg-1)}
.dx-hint .dx-ico{color:var(--iris)}
/* materials */
.dx-pipe{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr);gap:16px;align-items:start;margin-bottom:18px}
.dx-mats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.dx-mat{display:flex;align-items:center;justify-content:space-between;gap:10px;min-width:0;padding:8px 8px 8px 13px;border-radius:12px;border:1px solid var(--hairline);background:var(--surface-1);transition:border-color var(--dur-fast) var(--ease)}
.dx-mat.has{border-color:rgba(14,156,139,.35)}
.dx-mat-label{font-size:13px;font-weight:500;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dx-mat-label small{display:block;font-size:11px;color:var(--fg-3);font-weight:400;font-family:var(--font-mono)}
.dx-stepper{display:inline-flex;align-items:center;flex:0 0 auto;height:34px;border-radius:var(--r-pill);border:1px solid var(--hairline-2);background:var(--surface-1);overflow:hidden}
.dx-stepper button{display:grid;place-items:center;width:32px;height:100%;border:0;background:none;color:var(--fg-2);padding:0}
.dx-stepper button:hover{color:var(--iris);background:var(--iris-tint)}
.dx-stepper input{width:40px;height:100%;border:0;outline:0;background:none;text-align:center;font-family:var(--font-mono);font-variant-numeric:tabular-nums;font-size:13.5px;color:var(--cyan);-moz-appearance:textfield;padding:0}
.dx-stepper input::-webkit-outer-spin-button,.dx-stepper input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.dx-stepper-lg{height:42px}
.dx-stepper-lg button{width:42px}
.dx-stepper-lg input{width:72px;font-size:16px;font-weight:600}
.dx-field.err .dx-stepper{border-color:var(--err);box-shadow:0 0 0 3px var(--err-bg)}
/* photos */
.dx-photos{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.dx-photo{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;aspect-ratio:4/3;border-radius:14px;border:1.5px dashed var(--hairline-2);background:var(--surface-3);color:var(--fg-3);cursor:pointer;overflow:hidden;text-align:center;font-size:12.5px;padding:8px;transition:border-color var(--dur-fast) var(--ease),color var(--dur-fast) var(--ease)}
.dx-photo:hover{border-color:var(--iris);color:var(--iris)}
.dx-photo input{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.dx-photo.filled{border-style:solid;border-color:var(--hairline);padding:0;cursor:zoom-in}
.dx-photo.filled img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.dx-photo-tag{position:absolute;left:8px;bottom:8px;padding:3px 8px;border-radius:var(--r-pill);background:rgba(10,13,19,.62);color:#fff;font-size:11px;font-weight:500;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.dx-photo-x{position:absolute;right:7px;top:7px;display:grid;place-items:center;width:28px;height:28px;border-radius:9px;border:0;background:rgba(10,13,19,.62);color:#fff;padding:0}
.dx-photo-x:hover{background:var(--err)}
.dx-photo-b{font-weight:500;color:var(--fg-1);font-size:13px}
.dx-photo:hover .dx-photo-b{color:var(--iris)}
.dx-demo-img{position:absolute;inset:0;display:grid;place-items:center;background:linear-gradient(135deg,var(--surface-3),var(--iris-tint));color:var(--fg-3)}
.dx-gps{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:14px;border-radius:14px;border:1px solid var(--hairline);background:var(--surface-1)}
.dx-gps-vals{display:flex;gap:22px;flex-wrap:wrap;flex:1 1 auto}
.dx-gps-vals div{min-width:0}
.dx-gps-vals .dx-eyebrow{display:block;margin-bottom:2px}
.dx-gps-vals .dx-num{font-size:15px;font-weight:500}
.dx-field.err .dx-gps{border-color:var(--err);box-shadow:0 0 0 3px var(--err-bg)}
.dx-actionbar{position:sticky;bottom:0;z-index:15;display:flex;align-items:center;gap:10px;margin:18px -28px -56px;padding:12px 28px calc(12px + env(safe-area-inset-bottom));background:var(--hdr-bg);-webkit-backdrop-filter:blur(14px) saturate(1.6);backdrop-filter:blur(14px) saturate(1.6);border-top:1px solid var(--hairline)}
.dx-actionbar-note{flex:1 1 auto;min-width:0;font-size:12.5px;color:var(--fg-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dx-actionbar-note b{color:var(--fg-1);font-weight:500}

/* detail */
.dx-dhead{display:flex;align-items:flex-start;gap:16px;flex-wrap:wrap;padding:18px 18px 16px}
.dx-dhead-main{flex:1 1 320px;min-width:0}
.dx-dhead h2{margin:4px 0 6px;font-size:var(--fs-h1);font-weight:600;letter-spacing:var(--ls-tight);line-height:1.25;word-break:break-word}
.dx-dhead-meta{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12.5px;color:var(--fg-3)}
.dx-dhead-meta span{display:inline-flex;align-items:center;gap:6px}
.dx-dhead-actions{display:flex;gap:8px;flex-wrap:wrap}
.dx-dgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin-top:16px}
.dx-kv{display:grid;grid-template-columns:minmax(110px,.8fr) minmax(0,1.4fr);gap:0;font-size:13.5px}
.dx-kv>div{padding:10px 16px;border-bottom:1px solid var(--hairline);min-width:0;word-break:break-word}
.dx-kv>div:nth-last-child(-n+2){border-bottom:0}
.dx-kv .k{color:var(--fg-3);font-size:12.5px}
.dx-kv .v{display:flex;align-items:center;gap:8px;justify-content:space-between}
.dx-lock{display:flex;align-items:center;gap:10px;padding:12px 16px;background:var(--ok-bg);color:var(--ok);font-size:13px;border-bottom:1px solid var(--hairline)}
.dx-lock b{font-weight:600}
.dx-link{display:inline-flex;align-items:center;gap:6px;font-family:var(--font-mono);font-size:12.5px;color:var(--iris);background:var(--iris-tint);padding:4px 9px;border-radius:var(--r-sm)}

/* ================================ overlays ================================ */
.dx-scrim{position:fixed;inset:0;z-index:70;background:rgba(10,13,19,.38);-webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px);animation:dxFade var(--dur-base) var(--ease)}
@keyframes dxFade{from{opacity:0}to{opacity:1}}
.dx-modalwrap{position:fixed;inset:0;z-index:71;display:flex;align-items:center;justify-content:center;padding:16px}
.dx-modal{position:relative;width:min(520px,100%);max-height:calc(100vh - 32px);display:flex;flex-direction:column;background:var(--surface-1);border:1px solid var(--hairline);border-radius:var(--r-xl);box-shadow:var(--shadow-pop),var(--inset-hi);overflow:hidden;animation:dxPop var(--dur-slow) var(--spring)}
.dx-root[data-theme="dark"] .dx-modal{background:#151A25}
.dx-modal-wide{width:min(760px,100%)}
@keyframes dxPop{from{opacity:0;transform:translateY(10px) scale(.98)}to{opacity:1;transform:none}}
.dx-modal-head{display:flex;align-items:flex-start;gap:12px;padding:18px 18px 12px}
.dx-modal-head h3{margin:0;font-size:var(--fs-h3);font-weight:600;letter-spacing:-.01em}
.dx-modal-head p{margin:3px 0 0;font-size:13px;color:var(--fg-3)}
.dx-modal-body{padding:4px 18px 16px;overflow:auto}
.dx-modal-foot{display:flex;justify-content:flex-end;gap:8px;padding:12px 18px;border-top:1px solid var(--hairline);background:var(--meta-bg)}
.dx-issue{border:1px solid var(--hairline);border-radius:12px;overflow:hidden}
.dx-issue-row{display:flex;justify-content:space-between;gap:10px;padding:8px 12px;border-bottom:1px solid var(--hairline);font-size:13px}
.dx-issue-row:last-child{border-bottom:0}
.dx-issue-row .dx-mono{font-size:12.5px}
.dx-lightbox img{display:block;width:100%;max-height:70vh;object-fit:contain;background:#000;border-radius:12px}
.dx-pop{position:fixed;z-index:80;display:flex;flex-direction:column;min-width:260px;max-height:340px;background:var(--surface-1);border:1px solid var(--hairline-2);border-radius:14px;box-shadow:var(--shadow-pop),var(--inset-hi);overflow:hidden;animation:dxPop var(--dur-base) var(--spring)}
.dx-root[data-theme="dark"] .dx-pop{background:#151A25}
.dx-pop-search{display:flex;align-items:center;gap:8px;padding:0 12px;height:42px;border-bottom:1px solid var(--hairline);color:var(--fg-3)}
.dx-pop-search input{flex:1 1 auto;min-width:0;height:100%;border:0;outline:0;background:none;font-size:14px;color:var(--fg-1)}
.dx-pop-list{overflow:auto;padding:6px;overscroll-behavior:contain}
.dx-pop-group{padding:8px 10px 4px}
.dx-opt{display:flex;align-items:center;gap:10px;width:100%;min-height:38px;padding:7px 10px;border:0;border-radius:9px;background:none;text-align:left;font-size:13.5px;color:var(--fg-1)}
.dx-opt small{margin-left:auto;font-family:var(--font-mono);font-size:11px;color:var(--fg-3);flex:0 0 auto}
.dx-opt.active,.dx-opt:hover{background:var(--row-hover);color:var(--iris)}
.dx-opt[aria-selected="true"]{color:var(--iris);font-weight:500}
.dx-opt[aria-selected="true"]::after{content:"";width:6px;height:6px;border-radius:50%;background:var(--iris);flex:0 0 auto}
.dx-pop-empty{padding:18px 12px;text-align:center;font-size:13px;color:var(--fg-3)}
.dx-pop.dx-sheet{left:0!important;right:0;bottom:0;top:auto!important;width:auto!important;max-height:72vh;border-radius:20px 20px 0 0;padding-bottom:env(safe-area-inset-bottom)}
.dx-sheet-grab{width:38px;height:4px;border-radius:4px;background:var(--hairline-2);margin:8px auto 2px}
.dx-sheet-title{padding:4px 16px 8px;font-weight:600;font-size:14.5px}
.dx-toasts{position:fixed;left:50%;bottom:24px;z-index:90;display:flex;flex-direction:column;gap:8px;align-items:center;transform:translateX(-50%);pointer-events:none;width:max-content;max-width:calc(100vw - 32px)}
.dx-toast{display:flex;align-items:center;gap:10px;padding:10px 14px 10px 10px;border-radius:14px;background:var(--surface-1);border:1px solid var(--hairline-2);box-shadow:var(--shadow-pop);font-size:13px;color:var(--fg-1);pointer-events:auto;animation:dxPop var(--dur-slow) var(--spring)}
.dx-root[data-theme="dark"] .dx-toast{background:#1A1F2C}
.dx-toast .dx-tile{width:26px;height:26px;border-radius:8px}
.dx-skel{height:14px;border-radius:7px;background:linear-gradient(90deg,var(--surface-3),var(--hairline),var(--surface-3));background-size:200% 100%;animation:dxShimmer 1.2s linear infinite}
@keyframes dxShimmer{from{background-position:200% 0}to{background-position:-200% 0}}
.dx-tabbar{display:none}

/* ================================ responsive ================================ */
@media (max-width:1100px){
  .dx-kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .dx-cols{grid-template-columns:minmax(0,1fr)}
  .dx-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .dx-mats{grid-template-columns:repeat(2,minmax(0,1fr))}
  .dx-filters{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:880px){
  .dx-root{grid-template-columns:minmax(0,1fr)}
  .dx-side{display:none}
  .dx-top{padding:10px 16px;min-height:58px}
  .dx-top-mark{display:grid}
  .dx-top-mark .dx-mark{width:34px;height:34px;border-radius:10px}
  .dx-top-actions .dx-hide-m{display:none}
  .dx-view{padding:16px 16px calc(96px + env(safe-area-inset-bottom))}
  .dx-hero h1{font-size:22px}
  .dx-kpis{gap:10px}
  .dx-kpi{padding:13px 14px}
  .dx-kpi-val{font-size:22px}
  .dx-dgrid{grid-template-columns:minmax(0,1fr)}
  .dx-photos{grid-template-columns:repeat(2,minmax(0,1fr))}
  .dx-pipe{grid-template-columns:minmax(0,1fr)}
  .dx-actionbar{position:fixed;left:0;right:0;bottom:0;margin:0;padding:10px 16px calc(10px + env(safe-area-inset-bottom))}
  .dx-actionbar-note{display:none}
  .dx-actionbar .dx-btn{flex:1 1 0}
  .dx-tabbar{position:fixed;left:0;right:0;bottom:0;z-index:40;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));align-items:end;padding:6px 6px calc(6px + env(safe-area-inset-bottom));background:var(--hdr-bg);-webkit-backdrop-filter:blur(14px) saturate(1.6);backdrop-filter:blur(14px) saturate(1.6);border-top:1px solid var(--hairline)}
  .dx-root.dx-formmode .dx-tabbar{display:none}
  .dx-tab{display:flex;flex-direction:column;align-items:center;gap:3px;height:50px;justify-content:center;border:0;background:none;color:var(--fg-3);font-size:10.5px;font-weight:500;border-radius:12px}
  .dx-tab[aria-current="page"]{color:var(--iris)}
  .dx-tab-new{display:grid;place-items:center;justify-self:center;width:52px;height:52px;margin-top:-18px;border-radius:17px;border:0;color:#fff;background:linear-gradient(150deg,var(--iris),var(--iris-deep));box-shadow:var(--shadow-brand),inset 0 1px 0 rgba(255,255,255,.22)}
  .dx-toasts{bottom:calc(84px + env(safe-area-inset-bottom))}
  .dx-root.dx-formmode .dx-toasts{bottom:calc(76px + env(safe-area-inset-bottom))}
}
@media (max-width:720px){
  .dx-hide-sm{display:none!important}
  .dx-tablewrap.dx-swap{display:none}
  .dx-cards{display:block}
  .dx-grid,.dx-grid-2{grid-template-columns:minmax(0,1fr)}
  .dx-span-2{grid-column:auto}
  .dx-mats{grid-template-columns:minmax(0,1fr)}
  .dx-filters{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  .dx-zrow{grid-template-columns:minmax(0,1.2fr) minmax(0,1fr) 54px;gap:10px;padding:10px 14px}
  .dx-zrow>.dx-zpipe{display:none}
  .dx-kv{grid-template-columns:minmax(96px,.75fr) minmax(0,1.5fr)}
  .dx-kv>div{padding:10px 14px}
  .dx-modalwrap{align-items:flex-end;padding:0}
  .dx-modal,.dx-modal-wide{width:100%;max-height:88vh;border-radius:22px 22px 0 0;padding-bottom:env(safe-area-inset-bottom)}
  .dx-hero-actions{width:100%}
  .dx-hero-actions .dx-btn{flex:1 1 0}
}
@media (prefers-reduced-motion:reduce){
  .dx-root *,.dx-root *::before,.dx-root *::after{animation:none!important;transition:none!important}
}

/* ======================= DUX Ops Suite — shared additions (desktop + mobile) ======================= */
.dx-root{--rail-w:76px;--sub-w:236px}
.dx-status-err{color:var(--err);background:var(--err-bg)}
.dx-status-iris{color:var(--iris);background:var(--iris-tint)}
.dx-status-cyan{color:var(--cyan);background:var(--cyan-tint)}
.dx-tile-err{color:var(--err);background:var(--err-bg)}
.dx-kpi-val small{font-family:var(--font-ui)}
.dx-trunc{max-width:220px;overflow:hidden;text-overflow:ellipsis}
.dx-td-mono{font-size:12px;color:var(--fg-2)}

.dx-m-drawrow{display:flex;align-items:center;gap:11px;width:100%;min-height:48px;padding:6px 8px;border:0;border-radius:12px;background:none;text-align:left;color:var(--fg-1);font-size:14px;font-weight:500}
.dx-m-drawrow:active{background:var(--row-hover)}
.dx-m-drawrow .dx-tile,.dx-m-drawrow .dx-apptile{width:34px;height:34px;border-radius:10px;flex:0 0 auto}
.dx-m-drawlabel{display:flex;flex-direction:column;min-width:0;line-height:1.25}
.dx-m-drawlabel small{font-size:11.5px;font-weight:400;color:var(--fg-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dx-m-drawrow[aria-current="true"]{background:var(--iris-tint);color:var(--iris)}
.dx-m-drawapp{display:flex;align-items:center;gap:4px;border-radius:12px;padding-right:8px}
.dx-m-drawapp .dx-m-drawrow{flex:1 1 auto;min-width:0}
.dx-m-drawapp[aria-current="true"]{background:var(--hue-bg)}
.dx-m-drawapp[aria-current="true"] .dx-m-drawrow{color:var(--hue)}
.dx-m-drawapp .dx-m-check{width:26px;height:26px}
.dx-m-drawscreens{display:flex;flex-direction:column;gap:2px;margin:4px 0 8px 26px;padding-left:12px;border-left:2px solid var(--hairline)}
.dx-m-drawsub-row{display:flex;align-items:center;gap:10px;min-height:40px;padding:0 10px;border:0;border-radius:10px;background:none;color:var(--fg-2);font-size:13.5px;font-weight:500;text-align:left}
.dx-m-drawsub-row[aria-current="true"]{color:var(--iris);background:var(--iris-tint)}
/* ---- app picker: real checkboxes (row tap toggles) ---- */
.dx-m .dx-m-pickcard{gap:12px;padding:12px 10px 12px 14px;cursor:pointer;-webkit-tap-highlight-color:transparent;user-select:none}
.dx-m .dx-m-pickcard:active{transform:scale(.99)}
.dx-m-cbinput{position:absolute;opacity:0;width:1px;height:1px;pointer-events:none}
.dx-m-cb{display:grid;place-items:center;width:24px;height:24px;border-radius:7px;border:2px solid var(--hairline-2);background:var(--surface-1);color:transparent;flex:0 0 auto;transition:background var(--dur-fast) var(--ease),border-color var(--dur-fast) var(--ease)}
.dx-m-cbinput:checked+.dx-m-cb{background:var(--hue,var(--iris));border-color:var(--hue,var(--iris));color:#fff}
.dx-m-cbinput:focus-visible+.dx-m-cb{outline:2px solid var(--iris);outline-offset:2px}
.dx-m-place{font-weight:600;color:var(--hue,var(--iris))}
.dx-m-openbtn{flex:0 0 auto;padding:0 8px 0 10px;gap:2px}
.dx-m-pickhead{display:flex;align-items:center;justify-content:space-between;margin:0 2px 10px;font-size:13px;color:var(--fg-2)}
.dx-m-pickbar .dx-btn-ghost{flex:0 0 auto}
/* sidebar ticks use the same square checkbox look */
.dx-m .dx-m-drawapp .dx-m-check{width:24px;height:24px;border-radius:7px;border-width:2px}

</style>

<body>
<div class="dx-root dx-m" id="dxRoot" data-theme="light">
  <header class="dx-m-top" id="dxTop"></header>
  <nav class="dx-m-chips" id="dxChips" aria-label="Screens" hidden></nav>
  <main class="dx-m-view" id="dxView"></main>
  <nav class="dx-m-tabbar" id="dxTabbar" aria-label="Apps"></nav>
  <div class="dx-m-scrim" data-act="drawer-close"></div>
  <aside class="dx-m-drawer" id="dxDrawer" aria-label="Menu" aria-hidden="true"></aside>
  <div class="dx-toasts" role="status"></div>
</div>
<script>
/* DUX Ops Suite — shared engine (desktop + mobile).
   Config-driven renderers for dashboards, lists, forms, detail, reports and masters,
   plus the DUX primitives (icons, combo, modal, toast). Apps register via DX.app({...}). */
(function () {
  "use strict";
  const DX = (window.DX = window.DX || {});
  DX.apps = [];
  DX.app = cfg => { DX.apps.push(cfg); return cfg; };
  DX.get = key => DX.apps.find(a => a.key === key);

  /* ---------------------------------------------------------------- utils */
  const esc = (DX.esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])));
  const nf = (DX.nf = (n, d = 0) => Number(n || 0).toLocaleString("en-IN", { minimumFractionDigits: d, maximumFractionDigits: d }));
  DX.money = (n, d = 0) => "₹" + nf(n, d);
  const MON = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
  const isoDay = (DX.isoDay = d => new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10));
  const TODAY = (DX.TODAY = isoDay(new Date()));
  DX.addDays = (iso, n) => { const d = new Date(iso + "T00:00:00"); d.setDate(d.getDate() + n); return isoDay(d); };
  DX.monthStart = () => TODAY.slice(0, 8) + "01";
  DX.monthEnd = () => { const d = new Date(TODAY + "T00:00:00"); return isoDay(new Date(d.getFullYear(), d.getMonth() + 1, 0)); };
  DX.fmtDate = iso => { if (!iso) return "—"; const [y, m, d] = String(iso).slice(0, 10).split("-"); return `${d} ${MON[+m - 1]} ${y}`; };
  DX.digits = v => String(v == null ? "" : v).replace(/\D/g, "");
  DX.maskId = v => { const s = String(v || ""); if (s.length <= 4) return s; const dots = "•".repeat(s.length - 4); return (s.length === 12 ? dots.replace(/(.{4})/g, "$1 ").trim() : dots) + " " + s.slice(-4); };
  DX.rng = seed => () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
  DX.seeder = seed => { const r = DX.rng(seed); return { r, pick: a => a[Math.floor(r() * a.length)], int: (a, b) => a + Math.floor(r() * (b - a + 1)), flt: (a, b, d = 2) => +(a + r() * (b - a)).toFixed(d), chance: p => r() < p }; };
  DX.sum = (rows, f) => rows.reduce((s, r) => s + (+(typeof f === "function" ? f(r) : r[f]) || 0), 0);
  DX.groupCount = (rows, f) => { const m = {}; rows.forEach(r => { const k = typeof f === "function" ? f(r) : r[f]; if (k) m[k] = (m[k] || 0) + 1; }); return m; };
  DX.isImg = v => /^(blob:|data:image)/.test(String(v)) || /\.(jpe?g|png|webp|gif|bmp|heic|heif|avif)(\?|$)/i.test(String(v));
  DX.resolvers = [];
  DX.label = v => { if (v == null || v === "") return ""; for (const r of DX.resolvers) { try { const x = r(v); if (x) return x; } catch (_) { /* ignore */ } } return v; };
  // warehouses named after a Contractor at Project ("CP-22206 - JEWPL") read as the contractor’s name
  DX.whLabel = w => String(w || "").replace(/^(CP-\d+)(?= - )/, id => { const n = DX.label(id); return n && n !== id ? n : id; });
  DX.pending = new Set(); // in-flight photo uploads; DX.save waits for them
  // Phone photos are 3–12 MB: re-encode to ≤1600 px JPEG before upload (keeps the original if the browser can’t decode it, e.g. HEIC)
  DX.shrink = (file, max = 1600) => new Promise(resolve => {
    if (!/^image\/(jpeg|png|webp)$/.test(file.type) || file.size < 350000) return resolve(file);
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => { try { const k = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight)), c = document.createElement("canvas"); c.width = Math.round(img.naturalWidth * k); c.height = Math.round(img.naturalHeight * k); c.getContext("2d").drawImage(img, 0, 0, c.width, c.height); c.toBlob(b => { URL.revokeObjectURL(url); resolve(b && b.size < file.size ? new File([b], file.name.replace(/\.\w+$/, "") + ".jpg", { type: "image/jpeg" }) : file); }, "image/jpeg", 0.82); } catch (_) { URL.revokeObjectURL(url); resolve(file); } };
    img.onerror = () => { URL.revokeObjectURL(url); resolve(file); };
    img.src = url;
  });
  DX.uid = (p = "") => p + Math.random().toString(36).slice(2, 8).toUpperCase();

  /* ---------------------------------------------------------------- icons
     DUX thin-stroke set (24×24, 1.7 stroke). Base glyphs verbatim from components/brand/Icon.jsx; the rest drawn in the same style. */
  DX.ICONS = {
    filter: '<path d="M3 5h18l-7 8v6l-4-2v-4z"/>', clock: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
    truck: '<path d="M3 7h11v8H3z"/><path d="M14 9h4l3 3v3h-7"/><circle cx="7" cy="17" r="1.6"/><circle cx="17" cy="17" r="1.6"/>',
    building: '<path d="M5 21V5a1 1 0 0 1 1-1h8a1 1 0 0 1 1 1v16"/><path d="M15 9h3a1 1 0 0 1 1 1v11"/><path d="M9 8h2M9 12h2M9 16h2"/><path d="M3 21h18"/>',
    rupee: '<path d="M7 5h10M7 9h10M16 5c0 4-3.5 5-6.5 5L16 19"/><path d="M7 9h3"/>',

    plus: '<path d="M12 5v14"/><path d="M5 12h14"/>', moon: '<path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>',
    sun: '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4"/>',
    chevron: '<path d="m15 18-6-6 6-6"/>', layers: '<path d="m12 3 9 5-9 5-9-5z"/><path d="m3 13 9 5 9-5"/>',

    grid: '<rect x="3.5" y="3.5" width="7" height="7" rx="1.6"/><rect x="13.5" y="3.5" width="7" height="7" rx="1.6"/><rect x="3.5" y="13.5" width="7" height="7" rx="1.6"/><rect x="13.5" y="13.5" width="7" height="7" rx="1.6"/>',
    list: '<path d="M9 6h11M9 12h11M9 18h11"/><path d="M4.5 6h.01M4.5 12h.01M4.5 18h.01"/>', chart: '<path d="M3.5 20.5h17"/><path d="M7 16.5v-5M12 16.5V6.5M17 16.5v-8"/>',
    database: '<ellipse cx="12" cy="5.5" rx="7.5" ry="2.8"/><path d="M4.5 5.5v13c0 1.5 3.4 2.8 7.5 2.8s7.5-1.3 7.5-2.8v-13"/><path d="M4.5 12c0 1.5 3.4 2.8 7.5 2.8s7.5-1.3 7.5-2.8"/>',
    pin: '<path d="M12 21s-7-6.2-7-11.5a7 7 0 0 1 14 0C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.6"/>',
    target: '<circle cx="12" cy="12" r="7"/><circle cx="12" cy="12" r="2.4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/>',
    camera: '<path d="M4 8h3l1.5-2.5h7L17 8h3a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1z"/><circle cx="12" cy="13.5" r="3.5"/>',
    file: '<path d="M14 3.5H7a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8.5z"/><path d="M14 3.5v5h5M9 13h6M9 16.5h4"/>',
    play: '<circle cx="12" cy="12" r="8.5"/><path d="m10.2 8.8 5 3.2-5 3.2z"/>',
    image: '<rect x="3.5" y="4.5" width="17" height="15" rx="2"/><circle cx="9" cy="10" r="1.8"/><path d="m20.5 16-5-5-9 8.5"/>',
    edit: '<path d="M4 20h4L19 9a2.1 2.1 0 0 0-3-3L5 17z"/><path d="M14 7l3 3"/>', alert: '<path d="M12 3.5 2.5 20h19z"/><path d="M12 10v4.5M12 17.5v.01"/>',
    phone: '<path d="M5 4h3.5l1.6 4.2-2.2 1.4a11 11 0 0 0 6.5 6.5l1.4-2.2L20 15.5V19a1.5 1.5 0 0 1-1.6 1.5A16 16 0 0 1 3.5 5.6 1.5 1.5 0 0 1 5 4z"/>',
    idcard: '<rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="11" r="2.2"/><path d="M5.8 16a3.4 3.4 0 0 1 6.4 0M14 10h4M14 13.5h3"/>',
    pipe: '<path d="M3 8.5h6.5a2.5 2.5 0 0 1 2.5 2.5v2a2.5 2.5 0 0 0 2.5 2.5H21"/><path d="M3 5.5v6M21 12.5v6"/>',
    home: '<path d="M3.5 11.5 12 4.5l8.5 7"/><path d="M6 10v10h12V10"/><path d="M10 20v-5h4v5"/>',
    eye: '<path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12z"/><circle cx="12" cy="12" r="3"/>',

    minus: '<path d="M5 12h14"/>', down: '<path d="m6 9 6 6 6-6"/>', right: '<path d="m9 18 6-6-6-6"/>', back: '<path d="M19 12H5M11 18l-6-6 6-6"/>',
    lock: '<rect x="5" y="10.5" width="14" height="10" rx="2"/><path d="M8 10.5V7.5a4 4 0 0 1 8 0v3"/>',

    external: '<path d="M14 4h6v6M20 4l-9 9"/><path d="M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/>',
    trash: '<path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/>',

    droplet: '<path d="M12 3.5s6 6.4 6 10.5a6 6 0 0 1-12 0c0-4.1 6-10.5 6-10.5z"/>',
    wrench: '<path d="M14.5 5.5a4 4 0 0 0 4.9 4.9l1.1 1.1-8.9 8.9a2.1 2.1 0 0 1-3-3l8.9-8.9z"/><path d="M14.5 5.5 17 3l4 4-2.5 2.5"/>',
    beam: '<path d="M4 6h16M4 18h16"/><path d="M12 6v12"/><path d="M8 6v1.5M16 6v1.5M8 18v-1.5M16 18v-1.5"/>',
    mixer: '<path d="M3 17h10l2-6h4l2 3v3h-2"/><circle cx="7" cy="18.5" r="1.6"/><circle cx="17" cy="18.5" r="1.6"/><path d="M5 11l5-5 3 3-5 5z"/>',
    card: '<rect x="4" y="3.5" width="16" height="17" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/>',
    flow: '<circle cx="5.5" cy="12" r="2"/><circle cx="18.5" cy="6" r="2"/><circle cx="18.5" cy="18" r="2"/><path d="M7.5 12h4l5-5.2M11.5 12l5 5.2"/>',
    inbox: '<path d="M3.5 13.5 6 5h12l2.5 8.5V19a1 1 0 0 1-1 1h-15a1 1 0 0 1-1-1z"/><path d="M3.5 13.5h5l1 2h5l1-2h5"/>',
    swap: '<path d="M4 8h13l-3-3M20 16H7l3 3"/>', gauge: '<path d="M4 17a8 8 0 1 1 16 0"/><path d="m12 13 4-4"/><path d="M4 17h2M18 17h2"/>',
    settings: '<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/>',
    apps: '<rect x="4" y="4" width="6" height="6" rx="1.5"/><rect x="14" y="4" width="6" height="6" rx="1.5"/><rect x="4" y="14" width="6" height="6" rx="1.5"/><path d="M17 14v6M14 17h6"/>',
    bell: '<path d="M6 16V11a6 6 0 0 1 12 0v5l1.5 2h-15z"/><path d="M10 20a2 2 0 0 0 4 0"/>',
    upload: '<path d="M12 20V9"/><path d="m7 13 5-5 5 5"/><path d="M5 4h14"/>', dots: '<path d="M5 12h.01M12 12h.01M19 12h.01"/>'
  };
  const ic = (DX.ic = (n, s = 18) => `<svg class="dx-ico" viewBox="0 0 24 24" width="${s}" height="${s}" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${DX.ICONS[n] || DX.ICONS.sparkle}</svg>`);

  /* ---------------------------------------------------------------- primitives */
  let root = null;
  DX.mount = el => { root = el; };
  DX.$ = (s, el) => (el || root).querySelector(s);
  DX.$$ = (s, el) => Array.from((el || root).querySelectorAll(s));

  DX.toast = (msg, tone = "ok") => {
    const box = DX.$(".dx-toasts");
    const t = document.createElement("div");
    t.className = "dx-toast";
    t.innerHTML = `<span class="dx-tile dx-tile-${tone === "err" ? "pending" : "ok"}">${ic(tone === "err" ? "alert" : "check", 15)}</span><span>${msg}</span>`;
    box.appendChild(t);
    setTimeout(() => { t.style.transition = "opacity .3s"; t.style.opacity = "0"; setTimeout(() => t.remove(), 320); }, tone === "err" ? 3800 : 2600);
  };
  let modalClose = null;
  DX.openModal = ({ title, sub, body, foot, wide, onClose }) => {
    DX.closeModal();
    const scrim = document.createElement("div"); scrim.className = "dx-scrim";
    const wrap = document.createElement("div"); wrap.className = "dx-modalwrap";
    wrap.innerHTML = `<div class="dx-modal${wide ? " dx-modal-wide" : ""}" role="dialog" aria-modal="true" aria-label="${esc(title)}">
      <div class="dx-modal-head"><div style="flex:1;min-width:0"><h3>${esc(title)}</h3>${sub ? `<p>${sub}</p>` : ""}</div><button class="dx-ibtn dx-ibtn-ghost" data-modal-x aria-label="Close">${ic("close", 16)}</button></div>
      <div class="dx-modal-body">${body}</div>${foot ? `<div class="dx-modal-foot">${foot}</div>` : ""}</div>`;
    root.append(scrim, wrap);
    const onKey = e => { if (e.key === "Escape") DX.closeModal(); };
    wrap.addEventListener("click", e => { if (e.target === wrap || e.target.closest("[data-modal-x]")) DX.closeModal(); });
    document.addEventListener("keydown", onKey);
    modalClose = () => { scrim.remove(); wrap.remove(); document.removeEventListener("keydown", onKey); modalClose = null; if (onClose) onClose(); };
    const m = wrap.querySelector(".dx-modal");
    const f = m.querySelector("[autofocus]") || m.querySelector(".dx-modal-foot .dx-btn-primary");
    if (f) setTimeout(() => f.focus(), 30);
    return m;
  };
  DX.closeModal = () => { if (modalClose) modalClose(); };
  DX.confirm = ({ title, sub, body = "", ok = "Confirm", tone = "primary", noOk }) => new Promise(resolve => {
    let done = false;
    const m = DX.openModal({ title, sub, body, foot: `<button class="dx-btn dx-btn-ghost" data-c="0">${noOk ? "Close" : "Cancel"}</button>${noOk ? "" : `<button class="dx-btn dx-btn-${tone}" data-c="1">${ok}</button>`}` });
    const prev = modalClose;
    modalClose = () => { prev(); if (!done) resolve(false); };
    m.addEventListener("click", e => { const b = e.target.closest("[data-c]"); if (!b) return; done = true; resolve(b.dataset.c === "1"); DX.closeModal(); });
  });

  /* searchable combo / bottom sheet */
  const Combo = (DX.Combo = {
    pop: null, scrim: null, trigger: null, opts: [], onPick: null, active: -1,
    open(trigger, { options, value, onPick, title, placeholder, sheet, search }) {
      this.close();

  V.skeleton = host => { host.innerHTML = `<div class="dx-card"><div class="dx-card-body" style="display:grid;gap:14px">${[92, 74, 56, 92].map(w => `<div class="dx-skel" style="width:${w}%"></div>`).join("")}</div></div>`; };
  const newBtn = (V.newBtn = (doc, cls = "") => doc && doc.form && doc.canCreate !== false ? `<button class="dx-btn dx-btn-primary ${cls}" data-go="${DX.newRoute(doc)}">${ic("plus", 15)}${esc(doc.newLabel || "New " + doc.entity.singular.toLowerCase())}</button>` : "");
  const crumbApp = app => ({ label: app.title, go: app.key + "/" + app.screens[0].id });
  const screenFor = (app, type, docKey) => app.screens.find(s => s.type === type && (!docKey || (s.doc || app.docs[0].key) === docKey));
  const recentRows = (doc, n = 7) => DX.rows(doc).slice().sort((a, b) => String(dateOf(doc, b) || "").localeCompare(String(dateOf(doc, a) || "")) || String(b.name).localeCompare(String(a.name))).slice(0, n);
  V.recentList = (doc, n = 7) => recentRows(doc, n).map(r => `<button class="dx-lrow" data-go="${esc(DX.entryRoute(doc, r))}"><div class="dx-lrow-main"><div class="dx-lrow-title">${esc(title(doc, r))}</div><div class="dx-lrow-sub">${esc(sub(doc, r))}</div></div><div class="dx-lrow-end">${DX.statusOf(doc, r)}<span class="dx-mono dx-muted" style="font-size:11.5px">${DX.fmtDate(dateOf(doc, r))}</span></div></button>`).join("") || DX.empty("No entries yet", "Create the first entry to see it here.");

  /* ---------------------------------------------------------------- dashboard */
  V.dashboard = (ctx, screen) => {
    const { app } = ctx, doc = DX.docOf(app, screen.doc);
    ctx.chrome({ crumbs: [{ label: app.title }], title: screen.title || "Dashboard", actions: newBtn(doc, "dx-hide-m") });
    const k = app.kpis ? app.kpis(ctx) : [];
    const panels = app.panels ? app.panels(ctx) : [];
    const listScreen = screenFor(app, "list", doc.key), rep = app.screens.find(s => s.type === "report");
    ctx.host.innerHTML = `
      <section class="dx-hero"><div><div class="dx-eyebrow">${esc(app.eyebrow || app.title)}</div><h1>${app.headline || esc(app.title)}</h1>${app.intro ? `<p>${app.intro}</p>` : ""}</div>
        <div class="dx-hero-actions">${(app.heroActions ? app.heroActions(ctx) : newBtn(doc))}${rep ? `<button class="dx-btn dx-btn-secondary" data-go="${app.key}/${rep.id}">${ic("chart", 15)}${esc(rep.label)}</button>` : ""}</div></section>
      ${k.length ? `<section class="dx-kpis" style="grid-template-columns:repeat(${Math.min(4, k.length)},minmax(0,1fr))">${k.map(DX.kpi).join("")}</section>` : ""}
      <section class="dx-cols">${panels[0] || ""}
        ${app.noRecent ? (panels[1] || "") : DX.card(screen.recentTitle || "Recent " + doc.entity.plural.toLowerCase(), V.recentList(doc), { icon: "clock", action: listScreen ? `<button class="dx-btn dx-btn-ghost dx-btn-sm" data-go="${app.key}/${listScreen.id}">View all${ic("right", 13)}</button>` : "" })}
      </section>
      ${panels.slice(app.noRecent ? 2 : 1).join("")}`;
    if (app.bindDashboard) app.bindDashboard(ctx);
  };

  /* ---------------------------------------------------------------- list */
  const PAGE = 20;
  V.list = (ctx, screen) => {
    const { app } = ctx, doc = DX.docOf(app, screen.doc), s = st(app.key + ":" + screen.id), f = s.filters;
    ctx.chrome({ crumbs: [crumbApp(app), { label: screen.label }], title: screen.title || screen.label, actions: newBtn(doc, "dx-hide-m") });
    const remote = !!(doc.api && doc.api.query && !screen.rows);
    const base = remote ? [] : screen.rows ? screen.rows(DX.rows(doc)) : DX.rows(doc);
    const statuses = screen.statuses || doc.statusFilter || (doc.onSubmit ? [["", "All"], ["draft", "Draft"], ["submitted", "Submitted"]] : []);
    const skey = screen.statusKey || (r => DX.statusKey(doc, r));
    const rc = remote ? (s.rcounts || (doc.api.counts && doc.api.counts()) || null) : null;
    const counts = Object.fromEntries(statuses.map(([v]) => [v, remote ? (rc && rc[v || "all"] != null ? rc[v || "all"] : "") : v ? base.filter(r => skey(r) === v).length : base.length]));
    const filters = screen.filters || [];
    ctx.host.innerHTML = `
      ${screen.banner ? screen.banner(ctx) : ""}
      <div class="dx-toolbar">
        <label class="dx-search">${ic("search", 16)}<input data-q type="search" placeholder="${esc(screen.searchPh || "Search…")}" value="${esc(f.q || "")}" aria-label="Search"></label>
        ${statuses.length ? `<div class="dx-seg" role="group" aria-label="Status">${statuses.map(([v, l]) => `<button type="button" data-lstatus="${esc(v)}" aria-pressed="${(f.status || "") === v}">${esc(l)}${counts[v] !== "" ? `<span class="dx-mono">${counts[v]}</span>` : ""}</button>`).join("")}</div>` : ""}
      </div>
      ${filters.length || screen.dateFilter !== false ? `<div class="dx-filters">${filters.map(x => `<div class="dx-field"><span class="dx-label">${esc(x.label)}</span><button type="button" class="dx-combo" data-lfilter="${x.f}" aria-expanded="false"><span class="dx-combo-val ${f[x.f] ? "" : "ph"}">${esc(f[x.f] ? (x.display ? x.display(f[x.f]) : f[x.f]) : "All")}</span>${ic("down", 16)}</button></div>`).join("")}
        ${screen.dateFilter !== false ? `<label class="dx-field"><span class="dx-label">From date</span><input class="dx-input" type="date" data-ldate="from" value="${esc(f.from || "")}"></label><label class="dx-field"><span class="dx-label">To date</span><input class="dx-input" type="date" data-ldate="to" value="${esc(f.to || "")}"></label>` : ""}</div>` : ""}
      <div class="dx-card" data-results></div>`;
    let rseq = 0;
    const draw = () => {
      const q = String(f.q || "").toLowerCase().trim();
      if (remote) {
        const params = { q: String(f.q || "").trim(), status: f.status || "", filters: Object.fromEntries(filters.map(x => [x.f, f[x.f] || ""])), from: f.from || "", to: f.to || "", start: s.page * PAGE, limit: PAGE };

        if (s.rkey !== key || !s.rrows) {
          const my = ++rseq, box = ctx.host.querySelector("[data-results]");
          box.innerHTML = `<div class="dx-card-body" style="display:grid;gap:12px">${[88, 70, 80].map(w => `<div class="dx-skel" style="width:${w}%"></div>`).join("")}</div>`;
          doc.api.query(params).then(res => { if (my !== rseq || !box.isConnected) return; s.rkey = key; s.rrows = res.rows || []; s.rtotal = res.total != null ? res.total : s.rrows.length; if (res.counts) s.rcounts = res.counts; draw(); }, err => { if (my !== rseq || !box.isConnected) return; box.innerHTML = DX.empty("Couldn’t load entries", esc(err.message), `<button class="dx-btn dx-btn-secondary dx-btn-sm" data-lretry>Try again</button>`); });

        }
      }
      const rows = remote ? s.rrows : base.filter(r => (!f.status || skey(r) === f.status) && filters.every(x => !f[x.f] || (x.get ? x.get(r) : r[x.f]) === f[x.f]) &&
        (!f.from || String(dateOf(doc, r)) >= f.from) && (!f.to || String(dateOf(doc, r)) <= f.to) &&
        (!q || (screen.search || [r2 => r2.name, r2 => title(doc, r2), r2 => sub(doc, r2)]).map(fn => (typeof fn === "function" ? fn(r) : r[fn]) || "").join(" ").toLowerCase().includes(q)))
        .sort((a, b) => String(dateOf(doc, b) || "").localeCompare(String(dateOf(doc, a) || "")) || String(b.name).localeCompare(String(a.name)));
      s.visible = rows;
      const pills = [];
      if (f.status) pills.push(DX.pill("filter", "Status", (statuses.find(x => x[0] === f.status) || [0, f.status])[1], "status", "iris"));
      filters.forEach(x => { if (f[x.f]) pills.push(DX.pill(x.icon || "layers", x.label, x.display ? x.display(f[x.f]) : f[x.f], x.f, "cyan")); });
      if (f.from || f.to) pills.push(DX.pill("calendar", "Date", `${f.from ? DX.fmtDate(f.from) : "…"} → ${f.to ? DX.fmtDate(f.to) : "…"}`, "date", "pending", true));
      if (f.q) pills.push(DX.pill("search", "Search", `“${f.q}”`, "q"));
      const total = remote ? s.rtotal : rows.length;
      const pages = Math.max(1, Math.ceil(total / PAGE)); if (!remote) s.page = Math.min(s.page, pages - 1);
      const slice = remote ? rows : rows.slice(s.page * PAGE, s.page * PAGE + PAGE);
      const sum = screen.sum ? screen.sum(rows) : "";
      const plural = doc.entity.plural.toLowerCase(), singular = doc.entity.singular.toLowerCase();
      ctx.host.querySelector("[data-results]").innerHTML = `
        <div class="dx-filterbar"><div class="dx-eyebrow dx-filterbar-label">${ic("filter", 13)}Showing results for</div><div class="dx-pills">${pills.join("") || `<span class="dx-pill"><span class="dx-tile">${ic("list", 13)}</span><span class="dx-pill-v">All ${esc(plural)}</span></span>`}${pills.length ? `<button class="dx-btn dx-btn-ghost dx-btn-sm" data-lclear>Clear all</button>` : ""}</div></div>
        <div class="dx-meta"><span>Found <span class="dx-num">${nf(total)}</span> ${esc(total === 1 ? singular : plural)}${sum ? " · " + sum : ""}</span><button class="dx-btn dx-btn-ghost dx-btn-sm" data-lcsv ${rows.length ? "" : "disabled"}>${ic("download", 14)}Export CSV</button></div>
        ${rows.length ? `<div class="dx-swap">${DX.table(screen.columns, slice, { go: r => DX.entryRoute(doc, r) })}</div>
          <div class="dx-cards">${slice.map(r => `<button class="dx-ecard" data-go="${esc(DX.entryRoute(doc, r))}"><div class="dx-ecard-top"><div style="min-width:0"><div class="dx-ecard-name">${esc(title(doc, r))}</div><div class="dx-ecard-sub">${esc(sub(doc, r))}</div></div>${DX.statusOf(doc, r)}</div><div class="dx-ecard-foot">${(screen.cardFoot ? screen.cardFoot(r) : [`<span class="dx-mono">${DX.fmtDate(dateOf(doc, r))}</span>`]).join("")}</div></button>`).join("")}</div>
          <div class="dx-pager"><span><span class="dx-mono">${s.page * PAGE + 1}–${Math.min(total, s.page * PAGE + PAGE)}</span> of <span class="dx-mono">${nf(total)}</span></span><div class="dx-pager-btns"><button class="dx-ibtn" data-lpage="-1" aria-label="Previous page" ${s.page ? "" : "disabled"}>${ic("chevron", 15)}</button><button class="dx-ibtn" data-lpage="1" aria-label="Next page" ${s.page < pages - 1 ? "" : "disabled"}>${ic("right", 15)}</button></div></div>`
          : DX.empty(pills.length ? "Nothing matches these filters" : "No entries yet", pills.length ? "Remove a filter pill above or try a different search." : "Entries you create show up here.", pills.length ? `<button class="dx-btn dx-btn-secondary dx-btn-sm" data-lclear>Clear filters</button>` : newBtn(doc, "dx-btn-sm"))}`;
    };
    draw();
    const qi = ctx.host.querySelector("[data-q]"); let t;
    qi.addEventListener("input", () => { clearTimeout(t); t = setTimeout(() => { f.q = qi.value; s.page = 0; draw(); }, 150); });
    ctx.on("change", e => { const d = e.target.closest("[data-ldate]"); if (d) { f[d.dataset.ldate] = d.value; s.page = 0; draw(); } });
    ctx.on("click", e => {
      const t2 = e.target;
      const b = t2.closest("[data-lstatus]"); if (b) { f.status = b.dataset.lstatus; s.page = 0; ctx.host.querySelectorAll("[data-lstatus]").forEach(x => x.setAttribute("aria-pressed", x === b)); return draw(); }
      const fl = t2.closest("[data-lfilter]");
      if (fl) { const x = filters.find(y => y.f === fl.dataset.lfilter); const o = DX.opts(typeof x.options === "function" ? x.options(f) : x.options); o.allowClear = true; return DX.Combo.open(fl, { title: "Filter by " + x.label.toLowerCase(), value: f[x.f], options: o, onPick: v => { f[x.f] = v; (x.clears || []).forEach(c => (f[c] = "")); s.page = 0; V.list(ctx.fresh(), screen); } }); }
      const un = t2.closest("[data-unpill]"); if (un) { const k = un.dataset.unpill; if (k === "date") f.from = f.to = ""; else f[k] = ""; filters.filter(x => x.f === k).forEach(x => (x.clears || []).forEach(c => (f[c] = ""))); s.page = 0; return V.list(ctx.fresh(), screen); }
      if (t2.closest("[data-lclear]")) { s.filters = {}; s.page = 0; return V.list(ctx.fresh(), screen); }
      if (t2.closest("[data-lretry]")) { s.rkey = ""; return draw(); }
      if (t2.closest("[data-lcsv]")) return DX.csv(screen.csv || screen.columns, s.visible || [], `${app.key}-${screen.id}.csv`);
      const pg = t2.closest("[data-lpage]"); if (pg) { s.page += +pg.dataset.lpage; draw(); ctx.host.querySelector("[data-results]").scrollIntoView({ block: "start", behavior: "smooth" }); }
    });
  };

  /* ---------------------------------------------------------------- form */
  V.form = async (ctx, doc, name) => {
    const { app } = ctx;
    let d = DX.blank(doc), mode = "new";
    if (name) { const x = await DX.getFull(doc, name); if (!x) throw new Error("Entry not found."); if (x.docstatus === 2 || (x.docstatus === 1 && !doc.editSubmitted)) return ctx.go(DX.entryRoute(doc, x)); d = JSON.parse(JSON.stringify(x)); mode = "edit"; }
    else if (doc.defaults) Object.assign(d, doc.defaults());
    ctx.chrome({ crumbs: [crumbApp(app), ...(name ? [{ label: name, go: DX.entryRoute(doc, d) }, { label: "Edit" }] : [{ label: doc.newLabel || "New " + doc.entity.singular.toLowerCase() }])], title: name ? "Edit " + doc.entity.singular.toLowerCase() : (doc.newTitle || "New " + doc.entity.singular.toLowerCase()), actions: "" });
    const canSubmit = DX.canSubmit(doc);
    ctx.host.innerHTML = (doc.formBanner ? doc.formBanner(d) : "") + DX.formHTML(doc, d, mode) + `<div class="dx-actionbar"><div class="dx-actionbar-note" data-note></div><button type="button" class="dx-btn dx-btn-ghost dx-hide-sm" data-fcancel>Cancel</button><button type="button" class="dx-btn ${canSubmit ? "dx-btn-secondary" : "dx-btn-primary"}" data-fsave>${ic("check", 15)}${esc(doc.saveLabel || (canSubmit ? "Save draft" : "Save"))}</button>${canSubmit ? `<button type="button" class="dx-btn dx-btn-primary" data-fsubmit>${ic("lock", 15)}${esc(doc.submitLabel || "Save & submit")}</button>` : ""}</div>`;
    const F = DX.formCtl(doc, d, mode, ctx.host);
    ctx.form = F;
    F.onPaint = () => { const n = ctx.host.querySelector("[data-note]"); if (n) n.innerHTML = doc.formNote ? doc.formNote(d) : (mode === "edit" ? `Editing <b>${esc(d.name)}</b>` : `New ${esc(doc.entity.singular.toLowerCase())}`); };
    F.onPaint();
    const save = async submit => {
      const errs = DX.validate(doc, d, submit);
      if (Object.keys(errs).length) return F.showErrors(errs);
      if (submit && !(await V.confirmSubmit(doc, d))) return;
      if (!submit && doc.confirmSave && !(await doc.confirmSave(d))) return;
      let saved;
      busy(true);
      try { saved = await DX.save(doc, d); } catch (e) { busy(false); if (e.fields && Object.keys(e.fields).length) return F.showErrors(e.fields); if (doc.dupField && /already exists|duplicate/i.test(e.message)) { return F.showErrors({ [doc.dupField]: e.message }); } return e.list ? V.showProblems(e, "Couldn’t save") : DX.toast(esc(e.message), "err"); }
      F.dirty = false; ctx.form = null;
      if (submit) { try { const r = await DX.submit(doc, saved.name); DX.toast(doc.submitToast ? doc.submitToast(Object.assign({}, saved, r || {})) : `Submitted · <span class="dx-mono">${esc(saved.name)}</span>`); } catch (e) { DX.toast(`Saved as draft · ${esc(saved.name)}`); V.showProblems(e); } }
      else DX.toast(doc.saveToast ? doc.saveToast(saved) : `${canSubmit ? "Draft saved" : "Saved"} · <span class="dx-mono">${esc(saved.name)}</span>`);
      ctx.go(doc.afterSave ? doc.afterSave(saved) : DX.entryRoute(doc, saved));
    };
    const busy = on => ctx.host.querySelectorAll(".dx-actionbar .dx-btn").forEach(b => { b.disabled = on; if (on && b.matches("[data-fsave],[data-fsubmit]")) { b.dataset.label = b.innerHTML; b.innerHTML = ic("refresh", 15) + "Saving…"; } else if (!on && b.dataset.label) b.innerHTML = b.dataset.label; });
    ctx.host.querySelector("[data-fsave]").addEventListener("click", () => save(false));
    const sb = ctx.host.querySelector("[data-fsubmit]"); if (sb) sb.addEventListener("click", () => save(true));
    ctx.host.querySelector("[data-fcancel]").addEventListener("click", () => ctx.go(name ? DX.entryRoute(doc, d) : ctx.back()));
  };
  V.showProblems = (e, t) => { if (e.list) DX.openModal({ title: t || "Couldn’t submit yet", body: `<div class="dx-issue">${e.list.map(p => `<div class="dx-issue-row" style="color:var(--err)"><span>${esc(p)}</span></div>`).join("")}</div>`, foot: `<button class="dx-btn dx-btn-secondary" data-modal-x>Close</button>` }); else DX.toast(esc(e.message), "err"); };
  V.confirmSubmit = (doc, d) => {
    const problems = doc.submitProblems ? doc.submitProblems(d) : [];

    return DX.confirm({
      title: problems.length ? "Can’t submit yet" : (doc.submitTitle || "Submit this entry?"), noOk: problems.length > 0, ok: doc.submitOk || "Submit",
      sub: problems.length ? "Fix these first — the entry stays a draft." : (doc.submitSub || "Submitting locks the entry. It can’t be edited afterwards."),
      body: `${problems.length ? `<div class="dx-issue" style="margin-bottom:12px">${problems.map(p => `<div class="dx-issue-row" style="color:var(--err)"><span>${esc(p)}</span></div>`).join("")}</div>` : ""}${lines.length ? `${doc.submitLinesTitle ? `<div class="dx-eyebrow" style="margin-bottom:8px">${esc(doc.submitLinesTitle)}</div>` : ""}<div class="dx-issue">${lines.map(([k, v]) => `<div class="dx-issue-row"><span>${esc(k)}</span><span class="dx-num">${v}</span></div>`).join("")}</div>` : ""}${doc.submitNote ? `<p class="dx-muted" style="font-size:12.5px;margin-top:10px">${doc.submitNote(d)}</p>` : ""}`
    });
  };

  /* ---------------------------------------------------------------- detail */
  V.detail = async (ctx, doc, name) => {
    const { app } = ctx, d = await DX.getFull(doc, name);
    if (!d) throw new Error(`${doc.entity.singular} “${name}” not found.`);
    const locked = d.docstatus === 2 || (d.docstatus === 1 && !doc.editSubmitted);  // a cancelled record is never editable
    const canSubmit = d.docstatus === 0 && DX.canSubmit(doc);
    const canEdit = !locked && doc.form && doc.canEdit !== false;
    ctx.chrome({ crumbs: [crumbApp(app), { label: doc.entity.plural, go: (screenFor(app, "list", doc.key) ? app.key + "/" + screenFor(app, "list", doc.key).id : null) }, { label: d.name }], title: title(doc, d), actions: canEdit ? `<button class="dx-btn dx-btn-secondary dx-hide-m" data-go="${DX.editRoute(doc, d)}">${ic("edit", 15)}Edit</button>` : "" });
    const acts = (doc.detailActions ? doc.detailActions(d) : []).filter(Boolean);
    ctx.host.innerHTML = `
      <section class="dx-card dx-card-accent">
        ${doc.lockBanner && d.docstatus === 1 ? `<div class="dx-lock">${ic("lock", 16)}<span>${doc.lockBanner(d)}</span></div>` : ""}
        <div class="dx-dhead"><div class="dx-dhead-main"><div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap"><span class="dx-eyebrow">${esc(doc.doctype || doc.entity.singular)}</span>${DX.statusOf(doc, d)}<span class="dx-mono dx-muted" style="font-size:11.5px">${esc(d.name)}</span></div>
          <h2>${esc(title(doc, d))}</h2><div class="dx-dhead-meta">${dateOf(doc, d) ? `<span>${ic("calendar", 14)}<span class="dx-mono">${DX.fmtDate(dateOf(doc, d))}</span></span>` : ""}${sub(doc, d) ? `<span>${ic("pin", 14)}${esc(sub(doc, d))}</span>` : ""}</div></div>
          <div class="dx-dhead-actions">${canEdit ? `<button class="dx-btn dx-btn-secondary" data-go="${DX.editRoute(doc, d)}">${ic("edit", 15)}Edit</button>` : ""}${acts.map((a, i) => `<button class="dx-btn dx-btn-${a.tone || "secondary"}" data-dact="${i}">${ic(a.icon || "check", 15)}${esc(a.label)}</button>`).join("")}${canSubmit ? `<button class="dx-btn dx-btn-primary" data-dsubmit>${ic("lock", 15)}${esc(doc.submitBtn || "Submit")}</button>` : ""}</div></div>
      </section>
      ${doc.detailExtra ? doc.detailExtra(d) : ""}
      <div class="dx-dgrid">${doc.form ? DX.detailHTML(doc, d) : ""}</div>`;
    ctx.on("click", async e => {
      const ph = e.target.closest("[data-lbv]"); if (ph) return DX.lightbox(ph.dataset.lbv, ph.dataset.lbl, ph.dataset.lbi);
      const a = e.target.closest("[data-dact]"); if (a) { let r; try { r = await acts[+a.dataset.dact].run(d, ctx); } catch (err) { return V.showProblems(err, "Couldn’t complete that"); } if (r !== false) { DX.invalidate(doc); ctx.rerender(); } return; }

        const btn = e.target.closest("[data-dsubmit]"); btn.disabled = true; btn.innerHTML = ic("refresh", 15) + "Submitting…";
        try { const r = await DX.submit(doc, d.name); DX.toast(doc.submitToast ? doc.submitToast(Object.assign({}, d, r || {})) : `Submitted · <span class="dx-mono">${esc(d.name)}</span>`); ctx.rerender(); } catch (err) { btn.disabled = false; btn.innerHTML = ic("lock", 15) + esc(doc.submitBtn || "Submit"); V.showProblems(err); }
      }
    });

  };

  /* ---------------------------------------------------------------- report */
  // report filters live in DX.state so a remote screen.load(ctx) can read them before the first paint
  V.reportFilters = (app, screen) => { const s = st(app.key + ":" + screen.id); if (!s.init) { s.filters = Object.assign({ from: screen.monthDefault ? DX.monthStart() : DX.addDays(DX.TODAY, -(screen.days || 30)), to: screen.monthDefault ? DX.monthEnd() : DX.TODAY }, screen.defaults || {}); s.init = 1; } return s.filters; };
  V.report = (ctx, screen) => {
    const { app } = ctx, doc = DX.docOf(app, screen.doc), s = st(app.key + ":" + screen.id);
    V.reportFilters(app, screen);
    const redraw = () => (screen.remote ? ctx.rerender() : V.report(ctx.fresh(), screen));
    const f = s.filters, dk = screen.date || doc.entity.date || "date";
